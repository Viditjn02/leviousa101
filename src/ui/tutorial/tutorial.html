<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-src 'self' https://www.youtube.com;" />
        <title>Leviousa Welcome Video</title>
        <style>
            :root {
                /* Leviousa Brand Colors from website */
                --brand-start: #905151;
                --brand-end: #f2e9e9; 
                --bg: #000;
                --bg-soft: #050505;
                --bg-softer: #070707;
                --bg-card: #1a1a1a;
                --bg-card-2: #1e1e1e;
                --text: #fff;
                --muted: #bbb;
                --muted-2: #999;
                --border: #333;
                --shadow: rgba(0,0,0,0.6);
            }

            html, body {
                margin: 0;
                padding: 0;
                min-height: 100%;
                overflow: hidden;
                background: transparent;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            .video-container {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100vh;
                background: var(--shadow);
                backdrop-filter: blur(15px);
                position: relative;
                border-radius: 12px;
                overflow: hidden;
            }

            .video-header {
                padding: 20px;
                text-align: center;
                background: rgba(0, 0, 0, 0.8);
                border-bottom: 1px solid var(--border);
            }

            .video-title {
                font-size: clamp(18px, 3vw, 24px);
                font-weight: 800;
                background: linear-gradient(45deg, var(--brand-start), var(--brand-end));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin: 0 0 8px 0;
                letter-spacing: 0.05em;
            }

            .video-subtitle {
                font-size: clamp(12px, 2vw, 14px);
                color: var(--muted);
                margin: 0;
            }

            .video-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                padding: 20px;
                align-items: center;
                justify-content: center;
            }

            .video-player {
                width: 100%;
                max-width: 800px;
                height: 60vh;
                max-height: 450px;
                background: #000;
                border-radius: 8px;
                border: 1px solid var(--border);
                margin-bottom: 20px;
            }

            .video-controls {
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                margin-bottom: 20px;
            }

            .control-button {
                padding: 8px 16px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--bg-card-2);
                color: var(--text);
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .control-button:hover {
                background: var(--bg-softer);
                border-color: var(--muted-2);
                transform: translateY(-1px);
            }

            .control-button.primary {
                background: linear-gradient(45deg, var(--brand-start), var(--brand-end));
                border-color: var(--brand-start);
                color: #000;
                font-weight: 700;
            }

            .control-button.primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px var(--shadow);
            }

            .speed-display {
                font-size: 11px;
                color: var(--muted);
                margin-left: 4px;
            }

            .video-progress {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 12px;
                color: var(--muted);
            }

            .progress-bar {
                flex: 1;
                height: 4px;
                background: var(--bg-card-2);
                border-radius: 2px;
                position: relative;
                cursor: pointer;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(45deg, var(--brand-start), var(--brand-end));
                border-radius: 2px;
                width: 0%;
                transition: width 0.1s ease;
            }

            .video-actions {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-top: 20px;
            }

            .close-button {
                position: absolute;
                top: 15px;
                right: 15px;
                width: 28px;
                height: 28px;
                border: 1px solid var(--border);
                background: var(--bg-card-2);
                border-radius: 50%;
                color: var(--muted);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                transition: all 0.2s ease;
                z-index: 10;
            }

            .close-button:hover {
                background: var(--bg-softer);
                color: var(--text);
                border-color: var(--muted-2);
                transform: scale(1.1);
            }

            .video-error {
                display: none;
                text-align: center;
                color: var(--muted);
                padding: 40px;
                font-size: 14px;
            }

            .video-error.show {
                display: block;
            }

            .youtube-fallback {
                text-align: center;
                width: 100%;
                max-width: 800px;
            }

            .youtube-fallback.show {
                display: block !important;
            }

            .fallback-header {
                margin-bottom: 15px;
                color: var(--muted);
            }

            .fallback-header p {
                margin: 0;
                font-size: 14px;
                color: var(--text);
            }

            .youtube-fallback iframe {
                border-radius: 8px;
                background: #000;
                margin-bottom: 20px;
                box-shadow: 0 4px 12px var(--shadow);
            }

            .fallback-controls {
                display: flex;
                gap: 12px;
                justify-content: center;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <div class="video-container">
            <button class="close-button" onclick="closeTutorial()" title="Close (Esc)">✕</button>
            
            <div class="video-header">
                <h1 class="video-title">Welcome to Leviousa!</h1>
                <p class="video-subtitle">Watch this quick introduction to get started</p>
            </div>
            
            <div class="video-content">
                <video 
                    id="welcomeVideo" 
                    class="video-player" 
                    controls
                    preload="auto"
                    onloadstart="onVideoLoadStart()"
                    onloadeddata="onVideoLoaded()"
                    onerror="onVideoError()"
                    ontimeupdate="onTimeUpdate()"
                    onended="onVideoEnded()"
                >
                    <source src="../assets/welcome-video.mp4" type="video/mp4">
                    <p>Your browser doesn't support video playback. The welcome video should be bundled with the application.</p>
                </video>
                
                <!-- YouTube fallback when local video fails -->
                <div class="youtube-fallback" id="youtubeFallback" style="display: none;">
                    <div class="fallback-header">
                        <p>🌐 Loading video from YouTube...</p>
                    </div>
                    <iframe 
                        id="youtubeVideo"
                        width="100%" 
                        height="400" 
                        src="https://www.youtube.com/embed/kVpEBp34NiA?rel=0&modestbranding=1&showinfo=0" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                    <div class="fallback-controls">
                        <button class="control-button" onclick="retryLocalVideo()">🔄 Try Local Video</button>
                        <button class="control-button primary" onclick="closeTutorial()">Close Tutorial</button>
                    </div>
                </div>
                
                <div class="video-error" id="videoError">
                    <p>⚠️ Welcome video not available</p>
                    <p>The tutorial video could not be loaded. Please check your internet connection or contact support.</p>
                    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="showYouTubeFallback()" 
                                style="padding: 8px 16px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                            ▶️ Watch on YouTube
                        </button>
                        <button onclick="window.open('https://www.leviousa.com/help', '_blank')" 
                                style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                            📖 View Help Guide
                        </button>
                        <button onclick="closeTutorial()" 
                                style="padding: 8px 16px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                            ⏭️ Skip Tutorial
                        </button>
                    </div>
                </div>
                
                <div class="video-controls">
                    <button class="control-button" onclick="togglePlayPause()" id="playPauseBtn">
                        ⏸️ Pause
                    </button>
                    <button class="control-button" onclick="skipForward()">
                        ⏭️ Skip +10s
                    </button>
                    <button class="control-button" onclick="skipBackward()">
                        ⏮️ Back -10s
                    </button>
                    <button class="control-button" onclick="changeSpeed(-0.25)" id="speedDownBtn">
                        🐌 Slower
                    </button>
                    <button class="control-button" onclick="changeSpeed(0.25)" id="speedUpBtn">
                        🚀 Faster
                    </button>
                    <span class="speed-display" id="speedDisplay">1.0x</span>
                </div>
                
                <div class="video-progress">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" onclick="seekTo(event)">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
                
                <div class="video-actions">
                    <button class="control-button" onclick="skipTutorial()">Skip Video</button>
                    <button class="control-button primary" onclick="closeTutorial()">Close</button>
                </div>
            </div>
        </div>

        <script>
            console.log('[VideoTutorial] 🎥 Video tutorial window loaded');

            let video = null;
            let currentSpeed = 1.0;
            
            // Initialize autoPlay setting (default to false for regular users)
            window.tutorialAutoPlay = false;
            
            // Function to set autoPlay from main process
            window.setAutoPlay = function(shouldAutoPlay) {
                console.log(`[VideoTutorial] 🎛️ Setting autoPlay to: ${shouldAutoPlay}`);
                window.tutorialAutoPlay = shouldAutoPlay;
                
                // If video is already loaded and we're now setting autoPlay to true, start it
                if (shouldAutoPlay && video && video.readyState >= 3) {
                    console.log('[VideoTutorial] 🎬 Video already loaded, starting auto-play now');
                    video.play().catch(e => {
                        console.warn('[VideoTutorial] ⚠️ Auto-play prevented:', e);
                    });
                }
            };

            function onVideoLoadStart() {
                console.log('[VideoTutorial] 📥 Video loading started');
                video = document.getElementById('welcomeVideo');
                
                // Enhanced debugging for Electron app
                if (video) {
                    console.log(`[VideoTutorial] 🔍 Video element found`);
                    console.log(`[VideoTutorial] 📍 Video source: ${video.currentSrc || video.src || 'No source detected'}`);
                    console.log(`[VideoTutorial] 🏠 Base URI: ${document.baseURI}`);
                    console.log(`[VideoTutorial] 📁 Document location: ${document.location.href}`);
                    
                    // Check if file exists by trying to load it as an image first (hack to test file existence)
                    const testImage = new Image();
                    testImage.onload = () => {
                        console.log('[VideoTutorial] ✅ Video file appears to exist (loaded as image)');
                    };
                    testImage.onerror = () => {
                        console.warn('[VideoTutorial] ⚠️ Video file may not exist (failed to load as image)');
                    };
                    testImage.src = '../assets/welcome-video.mp4';
                } else {
                    console.error('[VideoTutorial] ❌ Video element not found!');
                }
            }

            function onVideoLoaded() {
                console.log('[VideoTutorial] ✅ Video loaded successfully');
                video = document.getElementById('welcomeVideo');
                document.getElementById('videoError').classList.remove('show');
                
                // Only auto-play if explicitly enabled (for first-time users)
                if (window.tutorialAutoPlay === true) {
                    console.log('[VideoTutorial] 🎬 Auto-playing video for first-time user');
                    video.play().catch(e => {
                        console.warn('[VideoTutorial] ⚠️ Auto-play prevented:', e);
                    });
                } else {
                    console.log('[VideoTutorial] ⏸️ Video ready, waiting for user to play (regular user)');
                }
            }

            function onVideoError() {
                console.error('[VideoTutorial] ❌ Video failed to load');
                
                // Enhanced error handling for Electron app
                const video = document.getElementById('welcomeVideo');
                let errorDetails = 'Unknown error';
                
                if (video) {
                    if (video.error) {
                        switch (video.error.code) {
                            case 1: // MEDIA_ERR_ABORTED
                                errorDetails = 'Video loading was aborted';
                                break;
                            case 2: // MEDIA_ERR_NETWORK
                                errorDetails = 'Network error while loading video';
                                break;
                            case 3: // MEDIA_ERR_DECODE
                                errorDetails = 'Video decode error';
                                break;
                            case 4: // MEDIA_ERR_SRC_NOT_SUPPORTED
                                errorDetails = 'Video format not supported or file not found';
                                break;
                            default:
                                errorDetails = `Media error code: ${video.error.code}`;
                        }
                    }
                    console.error(`[VideoTutorial] 📊 Error details: ${errorDetails}`);
                    console.error(`[VideoTutorial] 🔍 Video source: ${video.currentSrc || 'No source'}`);
                }
                
                // Update error message with more details
                const errorDiv = document.getElementById('videoError');
                const errorText = errorDiv.querySelector('p:last-of-type');
                errorText.innerHTML = `The welcome video could not be loaded. <br><br><strong>Technical details:</strong> ${errorDetails}<br><br>This might be due to the video file being missing from the app bundle. Click "Watch on YouTube" below for the online version.`;
                
                document.getElementById('videoError').classList.add('show');
                
                // For file not found errors, show an option to auto-fallback to YouTube after a delay
                if (video && video.error && video.error.code === 4) { // MEDIA_ERR_SRC_NOT_SUPPORTED
                    console.log('[VideoTutorial] 🎬 File not found - will offer YouTube fallback');
                    
                    // Add auto-fallback option after 3 seconds
                    setTimeout(() => {
                        const stillShowingError = errorDiv.classList.contains('show');
                        if (stillShowingError) {
                            const fallbackNotice = document.createElement('div');
                            fallbackNotice.style.cssText = 'margin-top: 10px; padding: 8px; background: rgba(255, 0, 0, 0.1); border-radius: 4px; font-size: 12px; color: var(--muted);';
                            fallbackNotice.innerHTML = '💡 <strong>Tip:</strong> Click "Watch on YouTube" above for the online tutorial video';
                            errorDiv.appendChild(fallbackNotice);
                        }
                    }, 3000);
                }
            }

            function onTimeUpdate() {
                if (!video) return;
                
                const progress = (video.currentTime / video.duration) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                
                document.getElementById('currentTime').textContent = formatTime(video.currentTime);
                document.getElementById('duration').textContent = formatTime(video.duration);
            }

            function onVideoEnded() {
                console.log('[VideoTutorial] 🏁 Video completed');
                document.getElementById('playPauseBtn').innerHTML = '▶️ Play';
            }

            function togglePlayPause() {
                if (!video) return;
                
                if (video.paused) {
                    video.play();
                    document.getElementById('playPauseBtn').innerHTML = '⏸️ Pause';
                } else {
                    video.pause();
                    document.getElementById('playPauseBtn').innerHTML = '▶️ Play';
                }
            }

            function skipForward() {
                if (!video) return;
                video.currentTime = Math.min(video.currentTime + 10, video.duration);
            }

            function skipBackward() {
                if (!video) return;
                video.currentTime = Math.max(video.currentTime - 10, 0);
            }

            function changeSpeed(delta) {
                if (!video) return;
                
                currentSpeed = Math.max(0.25, Math.min(2.0, currentSpeed + delta));
                video.playbackRate = currentSpeed;
                
                document.getElementById('speedDisplay').textContent = currentSpeed.toFixed(2) + 'x';
                
                // Update button states
                document.getElementById('speedDownBtn').disabled = currentSpeed <= 0.25;
                document.getElementById('speedUpBtn').disabled = currentSpeed >= 2.0;
            }

            function seekTo(event) {
                if (!video) return;
                
                const progressBar = event.currentTarget;
                const rect = progressBar.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const percentage = clickX / rect.width;
                
                video.currentTime = percentage * video.duration;
            }

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return minutes + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function closeTutorial() {
                console.log('[VideoTutorial] 📛 Closing video tutorial');
                if (window.electronAPI?.closeTutorialWindow) {
                    window.electronAPI.closeTutorialWindow();
                } else {
                    window.close();
                }
            }

            function skipTutorial() {
                console.log('[VideoTutorial] ⏭️ Skipping video tutorial');
                closeTutorial();
            }

            function showYouTubeFallback() {
                console.log('[VideoTutorial] 🎬 Showing YouTube fallback video');
                
                // Hide local video and error
                const videoPlayer = document.querySelector('.video-player');
                const videoError = document.getElementById('videoError');
                const videoControls = document.querySelector('.video-controls');
                const videoProgress = document.querySelector('.video-progress');
                const videoActions = document.querySelector('.video-actions');
                
                if (videoPlayer) videoPlayer.style.display = 'none';
                if (videoError) videoError.classList.remove('show');
                if (videoControls) videoControls.style.display = 'none';
                if (videoProgress) videoProgress.style.display = 'none';
                if (videoActions) videoActions.style.display = 'none';
                
                // Show YouTube fallback
                const youtubeFallback = document.getElementById('youtubeFallback');
                if (youtubeFallback) {
                    youtubeFallback.classList.add('show');
                    youtubeFallback.style.display = 'block';
                }
                
                // Update subtitle
                const subtitle = document.querySelector('.video-subtitle');
                if (subtitle) {
                    subtitle.textContent = 'Watch this quick introduction to get started (YouTube)';
                }
            }

            function retryLocalVideo() {
                console.log('[VideoTutorial] 🔄 Retrying local video');
                
                // Hide YouTube fallback
                const youtubeFallback = document.getElementById('youtubeFallback');
                if (youtubeFallback) {
                    youtubeFallback.classList.remove('show');
                    youtubeFallback.style.display = 'none';
                }
                
                // Show local video elements
                const videoPlayer = document.querySelector('.video-player');
                const videoControls = document.querySelector('.video-controls');
                const videoProgress = document.querySelector('.video-progress');
                const videoActions = document.querySelector('.video-actions');
                
                if (videoPlayer) videoPlayer.style.display = 'block';
                if (videoControls) videoControls.style.display = 'flex';
                if (videoProgress) videoProgress.style.display = 'flex';
                if (videoActions) videoActions.style.display = 'flex';
                
                // Reset subtitle
                const subtitle = document.querySelector('.video-subtitle');
                if (subtitle) {
                    subtitle.textContent = 'Watch this quick introduction to get started';
                }
                
                // Retry loading the video
                video = document.getElementById('welcomeVideo');
                if (video) {
                    video.load();
                }
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'Escape':
                        e.preventDefault();
                        closeTutorial();
                        break;
                    case ' ':
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        skipForward();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        skipBackward();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        changeSpeed(0.25);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        changeSpeed(-0.25);
                        break;
                }
            });

            // Initialize on load
            window.addEventListener('DOMContentLoaded', () => {
                console.log('[VideoTutorial] 🎬 Initializing video tutorial');
                
                // Focus the video for keyboard controls
                const videoElement = document.getElementById('welcomeVideo');
                if (videoElement) {
                    videoElement.focus();
                }
            });
        </script>
    </body>
</html>
