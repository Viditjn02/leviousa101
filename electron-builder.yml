# electron-builder.yml

# The unique application ID
appId: com.leviousa.app

# The user-facing application name
productName: Leviousa

# Publish configuration for Vercel-hosted updates
publish:
    provider: generic
    url: https://leviousa.com/updates/mac

# Protocols configuration for deep linking
protocols:
    - name: Leviousa Protocol
      schemes:
          - leviousa

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - leviousa_web/backend_node/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: leviousa_web/.next
      to: .next
      filter: ["**/*"]
    - from: services/paragon-mcp
      to: services/paragon-mcp
      filter: ["**/*"]
    - from: services/paragon-mcp/node_modules
      to: services/paragon-mcp/node_modules
      filter: ["**/*"]
    # Include Firebase service account file for packaged app
    - firebase-service-account.json

asarUnpack:
    - "src/ui/assets/SystemAudioDump"
    - "src/ui/assets/welcome-video.mp4"
    - "**/node_modules/sharp/**/*"
    - "**/node_modules/@img/**/*"
    - "**/node_modules/better-sqlite3/**/*"
    - "**/node_modules/keytar/**/*"
    - "services/paragon-mcp/**/*"
    - "src/data"

# Include MCP server dependencies explicitly
directories:
    buildResources: build

# Windows configuration
win:
    icon: src/ui/assets/logo.ico
    target:
        - target: nsis
          arch: x64
        - target: portable
          arch: x64
    requestedExecutionLevel: asInvoker
    signAndEditExecutable: true
    cscLink: build\certs\glass-dev.pfx
    cscKeyPassword: "${env.CSC_KEY_PASSWORD}"
    signtoolOptions:
      certificateSubjectName: "Glass Dev Code Signing"

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: Leviousa

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.productivity
    # Path to the .icns icon file
    icon: src/ui/assets/logo.icns
    # Minimum macOS version (supports both Intel and Apple Silicon)
    minimumSystemVersion: '11.0'
    hardenedRuntime: true
    gatekeeperAssess: false
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    # Code signing with Developer ID - Apple's official process
    type: "distribution"  # Distribution for signed releases
    identity: "Vidit Jain (8LNUMP84V8)"  # Your actual certificate (prefix removed as per electron-builder requirement)
    # signIgnore patterns removed to fix regex errors - will sign everything
    # Notarization enabled for production release
    notarize: true
    # Custom artifact naming for updates
    artifactName: Leviousa-${version}-mac.${ext}
    target:
      - target: zip
        arch: universal  # ZIP first for auto-updater
      - target: dmg
        arch: universal  # DMG for manual distribution

# DMG specific configuration
dmg:
    sign: true  # Sign the DMG installer
    title: "Leviousa"
    backgroundColor: "#1a1a1a"
    contents:
        - x: 130
          y: 220
          type: "file"
        - x: 410  
          y: 220
          type: "link"
          path: "/Applications"
    window:
        x: 400
        y: 100
        width: 540
        height: 380

# Additional configuration for native modules
buildDependenciesFromSource: true

# Ensure proper permissions and enable notarization
afterSign: scripts/notarize.js
